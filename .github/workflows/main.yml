name: Continuous Delivery

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint com flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Rodar testes com pytest
        run: pytest -v

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Empacotar aplicação
        run: |
          mkdir -p dist
          zip -r dist/controle-financeiro.zip app_financeiro main.py README.md

      - name: Upload do artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: controle-financeiro-build
          path: dist/controle-financeiro.zip

      - name: Criar Release (deploy)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          files: dist/controle-financeiro.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [build, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Enviar alerta no Discord
        run: |
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.deploy.result }}" = "success" ]; then
            STATUS="✅ Sucesso"
          else
            STATUS="❌ Falhou"
          fi

          curl -H "Content-Type: application/json" -X POST -d "{
            \"content\": \"**Controle Financeiro - CI/CD**\\nStatus: ${STATUS}\\nBranch: main\\nCommit: \`${{ github.sha }}\`\\nAutor: ${{ github.actor }}\\nRun: #${{ github.run_number }}\\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }" "${{ secrets.DISCORD_WEBHOOK }}"