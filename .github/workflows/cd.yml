name: CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Empacotar aplicação
        run: |
          mkdir -p dist
          zip -r dist/controle-financeiro.zip app_financeiro main.py README.md

      - name: Upload do artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: controle-financeiro-build
          path: dist/controle-financeiro.zip

      - name: Criar Release (deploy)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          files: dist/controle-financeiro.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}